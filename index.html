/* --- Modern Custom Dialog Styles --- */
#customAlertOverlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 100000;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

#customAlertOverlay.active {
  opacity: 1;
  pointer-events: auto;
}

.alertBox {
  width: 100%;
  max-width: 400px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  padding: 24px;
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
  transform: translateY(20px) scale(0.95);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
}

#customAlertOverlay.active .alertBox {
  transform: translateY(0) scale(1);
}

.alertIcon {
  font-size: 38px;
  margin-bottom: 12px;
}

.alertBox h3 {
  font-size: 20px;
  font-weight: 800;
  color: #0f172a;
  margin-bottom: 10px;
}

.alertBox p {
  font-size: 15px;
  color: #475569;
  line-height: 1.5;
  margin-bottom: 24px;
}

.alertActions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.alertBtn {
  flex: 1;
  padding: 12px 18px;
  border: none;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

.alertBtn-cancel {
  background: rgba(0, 0, 0, 0.05);
  color: #475569;
}

.alertBtn-cancel:hover {
  background: rgba(0, 0, 0, 0.08);
}

.alertBtn-danger {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
}

.alertBtn-danger:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
}

/* Dark Theme Adaptations */
.dark #customAlertOverlay {
  background: rgba(2, 6, 23, 0.7);
}

.dark .alertBox {
  background: rgba(30, 41, 59, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
}

.dark .alertBox h3 {
  color: #f8fafc;
}

.dark .alertBox p {
  color: #94a3b8;
}

.dark .alertBtn-cancel {
  background: rgba(255, 255, 255, 0.1);
  color: #cbd5e1;
}

.dark .alertBtn-cancel:hover {
  background: rgba(255, 255, 255, 0.15);
}

// Refactored sleek asynchronous clearChat function
window.clearChat = async function() {
  if (me === "afsheen") {
    alert("You are not allowed to clear chats.");
    return;
  }

  if (!currentChat) return;

  // Await sleek dialog response instead of blocking native window popups
  const confirmed = await showCustomConfirm({
    title: "Clear Chat History?",
    message: "Are you sure you want to clear this conversation? This configuration removes all text entries permanently.",
    icon: "🗑️",
    confirmText: "Yes, Delete"
  });

  if (!confirmed) return;

  /* GROUP CHAT PIPELINE */
  if (isGroup) {
    const snap = await getDocs(
      collection(db, "groupChats", GROUP_ID, "messages")
    );
    for (const d of snap.docs) {
      await deleteDoc(d.ref);
    }
    chatBox.innerHTML = "";
    return;
  }

  /* PERSONAL CHAT PIPELINE */
  let rid = roomId(me, currentChat);
  const snap = await getDocs(
    collection(db, "chats", rid, "messages")
  );
  for (const d of snap.docs) {
    await deleteDoc(d.ref);
  }
  chatBox.innerHTML = "";
};

window.reactMessage=async function(docId,emoji){

let rid=roomId(me,currentChat);

const messageRef=doc(db,"chats",rid,"messages",docId);

const snap=await getDocs(collection(db,"chats",rid,"messages"));

snap.forEach(async(d)=>{

if(d.id===docId){

let data=d.data();

let reacts=data.reactions || {};

Object.keys(reacts).forEach(r=>{
reacts[r]=reacts[r].filter(x=>x!==me);

if(reacts[r].length===0){
delete reacts[r];
}
});

if(!reacts[emoji]){
reacts[emoji]=[];
}

reacts[emoji].push(me);

await updateDoc(messageRef,{
reactions:reacts
});

}

});

};

let activeBubble=null;
let startX=0;
let currentX=0;
let dragging=false;

document.addEventListener("touchstart",(e)=>{

let bubble=e.target.closest(".msg");

if(!bubble) return;

activeBubble=bubble;
startX=e.touches[0].clientX;
dragging=true;

bubble.style.transition="none";

});

document.addEventListener("touchmove",(e)=>{

if(!dragging || !activeBubble) return;

currentX=e.touches[0].clientX;

let diff=currentX-startX;

if(diff<0) diff=0;

if(diff>120) diff=120;

if(activeBubble.classList.contains("me")){
activeBubble.style.transform=`translateX(${-diff}px)`;
}else{
activeBubble.style.transform=`translateX(${diff}px)`;
}

if(diff>70){
activeBubble.style.opacity=".85";
}else{
activeBubble.style.opacity="1";
}

});

document.addEventListener("touchend",()=>{

if(!dragging || !activeBubble) return;

let matrix=new WebKitCSSMatrix(
window.getComputedStyle(activeBubble).transform
);

let movedX=matrix.m41;

if(movedX>70){

replyMessage(
activeBubble.dataset.id,
activeBubble.dataset.text
);

activeBubble.style.transition=".18s";
if(activeBubble.classList.contains("me")){
activeBubble.style.transform="translateX(-20px)";
}else{
activeBubble.style.transform="translateX(20px)";
}

setTimeout(()=>{
activeBubble.style.transform="translateX(0)";
activeBubble.style.opacity="1";
},120);

}else{

activeBubble.style.transition=".25s";
activeBubble.style.transform="translateX(0)";
activeBubble.style.opacity="1";

}

dragging=false;
activeBubble=null;

});

window.closeImage=function(){
document.getElementById("imgViewer").classList.add("hidden");
};

msgInput.addEventListener("input",()=>{
if(!me || !currentChat) return;
let r=ref(rtdb,"users/"+me);
update(r,{typingTo:currentChat,online:true});
clearTimeout(window.typingTimer);
window.typingTimer=setTimeout(()=>{
update(r,{typingTo:"",online:true});
},1500);
});

window.addEventListener("beforeunload",()=>{
setOffline();
});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
if(e.key==="F12") e.preventDefault();
if(e.ctrlKey&&e.shiftKey&&["I","J","C"].includes(e.key.toUpperCase())) e.preventDefault();
if(e.ctrlKey&&e.key.toLowerCase()==="u") e.preventDefault();
});

function listenIncomingCalls(){

onValue(ref(rtdb,"calls/"+me+"/offer"),async(snapshot)=>{

let data=snapshot.val();

if(!data) return;

console.log("INCOMING OFFER");

incomingOffer=data;

currentCallId=data.callId;

document
.getElementById("callUI")
.classList.remove("hidden");

document
.getElementById("callText")
.innerText=data.from+" is calling...";

document
.getElementById("acceptBtn")
.style.display="block";

});

} 

window.toggleTheme = function(){

document.body.classList.toggle("dark");

localStorage.setItem(
"theme",
document.body.classList.contains("dark")
? "dark"
: "light"
);

};

const savedTheme =
localStorage.getItem("theme");

if(savedTheme==="dark"){
document.body.classList.add("dark");
}

document.getElementById("themeBtn").onclick = toggleTheme;

show("loginPage");
</script>
